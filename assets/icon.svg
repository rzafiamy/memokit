<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- MemoKit icon: a stack of saved tabs with a bookmark. Source for src/icons/*.png (npm run icons). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#shine)"/>
  <!-- back cards -->
  <rect x="40" y="26" width="56" height="44" rx="8" fill="#fff" opacity=".3"/>
  <rect x="34" y="34" width="60" height="48" rx="8" fill="#fff" opacity=".55"/>
  <!-- front card: browser tab -->
  <path d="M28 52a8 8 0 0 1 8-8h14l5-6h20a6 6 0 0 1 6 6v0h4a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8z" fill="#fff"/>
  <!-- content lines -->
  <rect x="38" y="62" width="30" height="6" rx="3" fill="#6366f1" opacity=".35"/>
  <rect x="38" y="74" width="40" height="6" rx="3" fill="#6366f1" opacity=".25"/>
  <rect x="38" y="86" width="22" height="6" rx="3" fill="#6366f1" opacity=".2"/>
  <!-- bookmark -->
  <path d="M74 44h16v32l-8-6-8 6z" fill="#22d3ee"/>
</svg>
