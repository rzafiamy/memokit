<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoKit Popup</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <img src="../icons/icon48.png" alt="Logo" class="logo">
      <div class="header-text">
        <h1>MemoKit</h1>
        <p class="subtitle">Digital Memory Companion</p>
      </div>
    </header>

    <main>
      <div class="status-card">
        <div class="status-indicator active"></div>
        <span id="status-text">System Active</span>
      </div>

      <div class="actions-row">
        <button id="capture-btn" class="btn-tool" title="Capture Current Windows">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button id="restore-btn" class="btn-tool" title="Restore Fixed Set">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        </button>
        <button id="save-profile-btn" class="btn-tool" title="Save Tabs to Profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <button id="close-others-btn" class="btn-tool danger" title="Close Others">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 12.8V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7.8"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="20" y1="16" x2="16" y2="20"/></svg>
        </button>
      </div>

      <div id="save-profile-form" class="inline-form" style="display: none;">
        <input type="text" id="new-profile-name" placeholder="Profile Name (e.g. Research)">
        <div class="form-actions">
          <button id="cancel-save-profile" class="btn-icon">✕</button>
          <button id="confirm-save-profile" class="btn-icon success">✓</button>
        </div>
      </div>
      <div class="profiles-section">
        <div class="section-header-inline">
          <h3>Quick Link Profiles</h3>
          <a href="#" class="manage-link" id="manage-profiles">Manage</a>
        </div>
        <div id="profiles-list" class="profiles-grid">
          <!-- Profiles will be injected here -->
          <p class="empty-hint">No profiles configured.</p>
        </div>
      </div>
    </main>

    <footer>
      <a href="#" id="open-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configure Options
      </a>
      <span class="version">v1.2.0</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
