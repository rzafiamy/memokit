<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MemoKit</title>
  <link rel="stylesheet" href="../shared/dialog.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="top">
      <img src="../icons/icon48.png" alt="" class="logo">
      <h1>MemoKit</h1>
      <span class="version" id="version"></span>
      <button class="icon-btn" id="open-settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.830l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search profiles and sites…" autocomplete="off" spellcheck="false" autofocus>
    </div>

    <div id="undo-banner" class="undo-banner" hidden>
      <span id="undo-text"></span>
      <button id="undo-btn">Undo</button>
    </div>

    <div class="list-header">
      <span id="list-title">Profiles</span>
      <a href="#" id="manage-profiles">Manage</a>
    </div>
    <div id="results" class="results" role="listbox"></div>

    <div id="save-profile-form" class="inline-form" hidden>
      <input type="text" id="new-profile-name" placeholder="Profile name (e.g. Infra)" list="profile-datalist">
      <datalist id="profile-datalist"></datalist>
      <button id="confirm-save-profile" class="mini primary">Save</button>
      <button id="cancel-save-profile" class="mini">Cancel</button>
    </div>

    <div class="toolbar">
      <button id="save-profile-btn" title="Save the tabs of this window as a profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Save window</span>
      </button>
      <button id="restore-btn" title="Reopen missing startup tabs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        <span>Startup</span>
      </button>
      <button id="capture-btn" title="Use the tabs of this window as the startup list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>Set startup</span>
      </button>
      <button id="close-others-btn" class="danger" title="Close all tabs except the active and pinned ones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 12.8V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7.8"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="20" y1="16" x2="16" y2="20"/></svg>
        <span>Close others</span>
      </button>
    </div>

    <footer class="hints">
      <span><kbd>↵</kbd> open</span>
      <span><kbd>⇧↵</kbd> new window</span>
      <span><kbd>Ctrl↵</kbd> add here</span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
